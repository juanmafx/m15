name: CI

on:
  push:
    branches: [master, stg, dev, modernize/2026]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.13.5"
          enable-cache: false
      - run: uv sync --locked --no-install-project --no-build
      - run: uv run --no-sync ruff format --check src tests tools
      - run: uv run --no-sync ruff check src tests tools
      - run: uv run --no-sync mypy
      - run: uv run --no-sync python -m pytest --cov --cov-branch
      - run: uv export --locked --all-groups --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/requirements.txt"
      - run: uv run --no-sync pip-audit --require-hashes --disable-pip -r "$RUNNER_TEMP/requirements.txt"
